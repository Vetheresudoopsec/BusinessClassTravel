# Local Apache for Business Class Travel — mirrors the HostGator setup (Apache + PHP).
# Uses Homebrew's httpd and php. Nothing here touches the system or Homebrew configs.
#
# Start:  dev/serve.sh            then open http://localhost:8080
# Stop:   dev/serve.sh stop
# PROJECT is passed in by dev/serve.sh (the repository folder).

ServerRoot "/opt/homebrew/opt/httpd"
Listen 127.0.0.1:8080
ServerName localhost

LoadModule mpm_prefork_module lib/httpd/modules/mod_mpm_prefork.so
LoadModule authz_core_module lib/httpd/modules/mod_authz_core.so
LoadModule authz_host_module lib/httpd/modules/mod_authz_host.so
LoadModule unixd_module lib/httpd/modules/mod_unixd.so
LoadModule dir_module lib/httpd/modules/mod_dir.so
LoadModule mime_module lib/httpd/modules/mod_mime.so
LoadModule log_config_module lib/httpd/modules/mod_log_config.so
LoadModule headers_module lib/httpd/modules/mod_headers.so
LoadModule rewrite_module lib/httpd/modules/mod_rewrite.so
LoadModule alias_module lib/httpd/modules/mod_alias.so
LoadModule php_module /opt/homebrew/opt/php/lib/httpd/modules/libphp.so

PidFile "${PROJECT}/dev/logs/httpd.pid"
ErrorLog "${PROJECT}/dev/logs/error.log"
LogFormat "%h %t \"%r\" %>s %b" common
CustomLog "${PROJECT}/dev/logs/access.log" common
LogLevel warn

TypesConfig /opt/homebrew/etc/httpd/mime.types
AddType image/webp .webp
AddType video/webm .webm

DocumentRoot "${PROJECT}"
DirectoryIndex index.php index.html

<Directory />
  AllowOverride None
  Require all denied
</Directory>

<Directory "${PROJECT}">
  Options -Indexes +FollowSymLinks
  AllowOverride All
  Require all granted
</Directory>

# Never serve the working folders, only the site itself.
RedirectMatch 404 "^/(\.git|\.claude|\.impeccable|\.taste-skill|dev|tools|previous-design|cache)(/|$)"
<FilesMatch "^\.">
  Require all denied
</FilesMatch>

<FilesMatch "\.php$">
  SetHandler application/x-httpd-php
</FilesMatch>

# Local development: always fetch fresh files.
Header set Cache-Control "no-store"
