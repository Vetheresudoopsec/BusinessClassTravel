---
# cPanel Git Version Control: copies the live site into the domain's own folder on each deployment
# (cPanel > Git Version Control > Manage > Pull or Deploy > Deploy HEAD Commit).
#
# DEPLOYPATH is the document root shown for the domain in cPanel > Domains. Other domains on the
# account have their own folders and are never touched.
# Only the site itself is copied. Working folders (dev, tools, previous-design, .taste-skill)
# and Git files stay in the repository folder.
#
# Your .env goes in html_private/ inside the site folder
# (/home/discoets/BusinessClassTravel.com/html_private/.env), copied from .env.example with
# MAIL_TEST left empty. It is never deployed from Git, and deployments leave it alone.
deployment:
  tasks:
    - export DEPLOYPATH=/home/discoets/BusinessClassTravel.com/
    # Stop rather than copy anywhere else if the folder isn't there
    - /bin/test -d $DEPLOYPATH || exit 1
    # Pages, styles, scripts and server rules
    - /bin/cp index.html terms.html privacy.html accessibility.html 404.html $DEPLOYPATH
    - /bin/cp styles.css app.js motion.js quote.php $DEPLOYPATH
    - /bin/cp .htaccess robots.txt sitemap.xml $DEPLOYPATH
    - /bin/cp favicon.ico favicon.svg apple-touch-icon.png $DEPLOYPATH
    # Folders: location and photo endpoints, airport lists, images, phone library
    - /bin/cp -R api data img vendor $DEPLOYPATH
    # Fresh styles and scripts after every deployment: the pages ask for styles.css?v=dev and app.js?v=dev,
    # and the live copies get this deployment's time instead, so browsers and Cloudflare can't serve old ones.
    - export VERSION=$(/bin/date +%Y%m%d%H%M%S)
    - /bin/sed -i "s/?v=dev\"/?v=${VERSION}\"/g" ${DEPLOYPATH}index.html ${DEPLOYPATH}terms.html ${DEPLOYPATH}privacy.html ${DEPLOYPATH}accessibility.html ${DEPLOYPATH}404.html
    # Private settings folder for .env, with its own lock in case the site's .htaccess is ever missing
    - /bin/mkdir -p ${DEPLOYPATH}html_private
    - /bin/cp html_private/.htaccess ${DEPLOYPATH}html_private/
    - /bin/chmod 750 ${DEPLOYPATH}html_private
    # Writable folder for photo results, the request rate limit and test mail (blocked from the web by .htaccess)
    - /bin/mkdir -p ${DEPLOYPATH}cache
    - /bin/chmod 755 ${DEPLOYPATH}cache
