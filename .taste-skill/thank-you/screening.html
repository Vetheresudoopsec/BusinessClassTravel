<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Image screening</title>
<style>:root{--blue:#0f2a78;--ink:#14202f;--bg:#fff;--tint:#eef2f9}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--blue);color:#fff;padding:14px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0}header p{margin:0;opacity:.85;font-size:14px}#count{margin-left:auto;font-weight:600}
main{padding:8px 16px 64px}h2{font-size:22px;margin:32px 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.c{display:block;cursor:pointer;background:var(--tint);position:relative}.c img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.c span{display:block;padding:8px 10px;font-size:13px}.c small{opacity:.7}.c input{position:absolute;top:10px;left:10px;width:22px;height:22px;accent-color:var(--blue)}
.c:has(input:checked){outline:4px solid var(--blue)}#list{font-weight:600}</style>
